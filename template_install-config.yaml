apiVersion: v1
baseDomain: ocp.dev
metadata:
  name: sno
compute:
- name: worker
  replicas: 0
controlPlane:
  name: master
  replicas: 1
  hyperthreading: Enabled
platform:
  none: {}
bootstrapInPlace:
  installationDisk: /dev/vda
networking:
  clusterNetwork:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  networkType: OVNKubernetes
  serviceNetwork:
  - 172.30.0.0/16
pullSecret: '${pullSecret}'
sshKey: '${sshKey}'
